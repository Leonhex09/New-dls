<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLS Tournament Hub</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: #131a2a;
            --bg-card-hover: #1a2338;
            --accent: #00e676;
            --accent-glow: rgba(0, 230, 118, 0.25);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #232d42;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 50px;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #101726 0%, #090d16 100%);
            border-bottom: 1px solid var(--border);
            padding: 24px 16px;
            text-align: center;
            position: relative;
        }

        .badge {
            display: inline-block;
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid var(--accent);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px auto;
            padding: 0 16px;
            max-width: 800px;
        }

        .tab-btn {
            flex: 1;
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: var(--accent);
            color: #050a14;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Group Cards & Standings Table */
        .group-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .group-header {
            background: rgba(255, 255, 255, 0.03);
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .group-header h2 {
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: 700;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.9rem;
        }

        th {
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-muted);
            font-weight: 600;
            padding: 12px 8px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        td {
            padding: 12px 8px;
            border-top: 1px solid var(--border);
        }

        th.team-col, td.team-col {
            text-align: left;
            padding-left: 16px;
            font-weight: 600;
            min-width: 150px;
        }

        .pos-badge {
            display: inline-block;
            width: 24px;
            height: 24px;
            line-height: 24px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            background: #1e293b;
        }

        .qualify-top .pos-badge {
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .pts-col {
            font-weight: 800;
            color: var(--accent);
            font-size: 1rem;
        }

        /* Fixtures & Results Cards */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-select {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .match-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.2s;
        }

        .match-card:hover {
            border-color: #334155;
        }

        .match-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
        }

        .match-body {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
        }

        .team-home {
            text-align: right;
            font-weight: 700;
            font-size: 1rem;
        }

        .team-away {
            text-align: left;
            font-weight: 700;
            font-size: 1rem;
        }

        .score-box {
            background: #090d16;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 2px;
            min-width: 78px;
            text-align: center;
        }

        .score-box.upcoming {
            color: var(--warning);
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .score-box.played {
            color: var(--accent);
            border-color: rgba(0, 230, 118, 0.4);
        }

        .status-bar {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 40px;
        }

        @media (max-width: 500px) {
            header h1 { font-size: 1.4rem; }
            .team-home, .team-away { font-size: 0.9rem; }
            th, td { padding: 10px 5px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="badge" id="season-badge">DLS CHAMPIONSHIP</div>
        <h1 id="tournament-title">DLS Group Stage & Fixtures</h1>
        <p id="last-updated">Loading tournament data...</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('standings', this)">Standings</button>
        <button class="tab-btn" onclick="switchTab('fixtures', this)">Fixtures</button>
        <button class="tab-btn" onclick="switchTab('results', this)">Results</button>
    </div>

    <div class="container">
        <!-- STANDINGS SECTION -->
        <div id="standings" class="section active">
            <div id="standings-container"></div>
        </div>

        <!-- UPCOMING FIXTURES SECTION -->
        <div id="fixtures" class="section">
            <div class="filter-bar">
                <select id="fixture-group-filter" class="filter-select" onchange="renderMatches()">
                    <option value="ALL">All Groups</motion>
                </select>
            </div>
            <div id="fixtures-container"></div>
        </div>

        <!-- RESULTS SECTION -->
        <div id="results" class="section">
            <div class="filter-bar">
                <select id="result-group-filter" class="filter-select" onchange="renderMatches()">
                    <option value="ALL">All Groups</option>
                </select>
            </div>
            <div id="results-container"></div>
        </div>
    </div>

    <footer>
        Powered by GitHub Pages • Live DLS Tournament Tracker
    </footer>

    <script>
        let tournamentData = null;

        async function loadData() {
            try {
                const response = await fetch(`data.json?t=${Date.now()}`, { cache: "no-store" });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                tournamentData = await response.json();
                initApp();
            } catch (err) {
                console.error("Failed to load data.json:", err);
                document.getElementById("last-updated").textContent = "Error loading data.json from repository.";
                document.getElementById("standings-container").innerHTML = `
                    <div class="status-bar">
                        Could not load <strong>data.json</strong>.<br>
                        Please ensure <code>data.json</code> is committed in your repository alongside <code>index.html</code>.
                    </div>
                `;
            }
        }

        function initApp() {
            document.getElementById("tournament-title").textContent = tournamentData.tournamentName || "DLS Tournament";
            document.getElementById("season-badge").textContent = tournamentData.season || "DLS LEAGUE";
            document.getElementById("last-updated").textContent = `Last Updated: ${tournamentData.lastUpdated || "Just now"}`;

            populateGroupFilters();
            renderStandings();
            renderMatches();
        }

        function populateGroupFilters() {
            const groupNames = (tournamentData.groups || []).map(g => g.name);
            const filters = ["fixture-group-filter", "result-group-filter"];

            filters.forEach(id => {
                const select = document.getElementById(id);
                select.innerHTML = `<option value="ALL">All Groups</option>`;
                groupNames.forEach(name => {
                    const opt = document.createElement("option");
                    opt.value = name;
                    opt.textContent = name;
                    select.appendChild(opt);
                });
            });
        }

        function calculateGroupTable(group) {
            const stats = {};
            (group.teams || []).forEach(team => {
                stats[team] = { team, mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
            });

            (tournamentData.matches || [])
                .filter(m => m.group === group.name && m.status === "played" && m.homeScore !== null && m.awayScore !== null)
                .forEach(m => {
                    const hScore = Number(m.homeScore);
                    const aScore = Number(m.awayScore);

                    if (!stats[m.home]) stats[m.home] = { team: m.home, mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
                    if (!stats[m.away]) stats[m.away] = { team: m.away, mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };

                    stats[m.home].mp++;
                    stats[m.away].mp++;
                    stats[m.home].gf += hScore;
                    stats[m.home].ga += aScore;
                    stats[m.away].gf += aScore;
                    stats[m.away].ga += hScore;

                    if (hScore > aScore) {
                        stats[m.home].w++;
                        stats[m.home].pts += 3;
                        stats[m.away].l++;
                    } else if (hScore < aScore) {
                        stats[m.away].w++;
                        stats[m.away].pts += 3;
                        stats[m.home].l++;
                    } else {
                        stats[m.home].d++;
                        stats[m.away].d++;
                        stats[m.home].pts += 1;
                        stats[m.away].pts += 1;
                    }
                });

            return Object.values(stats)
                .map(t => ({ ...t, gd: t.gf - t.ga }))
                .sort((a, b) => {
                    if (b.pts !== a.pts) return b.pts - a.pts;
                    if (b.gd !== a.gd) return b.gd - a.gd;
                    return b.gf - a.gf;
                });
        }

        function renderStandings() {
            const container = document.getElementById("standings-container");
            container.innerHTML = "";
            const qualifyCount = tournamentData.qualifyCount ?? 2;

            if (!tournamentData.groups || !tournamentData.groups.length) {
                container.innerHTML = `<div class="status-bar">No groups added yet.</div>`;
                return;
            }

            tournamentData.groups.forEach(group => {
                const tableData = calculateGroupTable(group);
                const rowsHtml = tableData.map((row, idx) => {
                    const pos = idx + 1;
                    const rowClass = pos <= qualifyCount ? "qualify-top" : "";
                    const gdDisplay = row.gd > 0 ? `+${row.gd}` : row.gd;
                    return `
                        <tr class="${rowClass}">
                            <td><span class="pos-badge">${pos}</span></td>
                            <td class="team-col">${escapeHtml(row.team)}</td>
                            <td>${row.mp}</td>
                            <td>${row.w}</td>
                            <td>${row.d}</td>
                            <td>${row.l}</td>
                            <td>${row.gf}</td>
                            <td>${row.ga}</td>
                            <td>${gdDisplay}</td>
                            <td class="pts-col">${row.pts}</td>
                        </tr>
                    `;
                }).join("");

                container.innerHTML += `
                    <div class="group-card">
                        <div class="group-header">
                            <h2>${escapeHtml(group.name)}</h2>
                            <span style="font-size:0.75rem; color:var(--text-muted);">Top ${qualifyCount} Qualify</span>
                        </div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th class="team-col">Team</th>
                                        <th>MP</th>
                                        <th>W</th>
                                        <th>D</th>
                                        <th>L</th>
                                        <th>GF</th>
                                        <th>GA</th>
                                        <th>GD</th>
                                        <th>PTS</th>
                                    </tr>
                                </thead>
                                <tbody>${rowsHtml}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            });
        }

        function renderMatches() {
            const fixtureFilter = document.getElementById("fixture-group-filter").value;
            const resultFilter = document.getElementById("result-group-filter").value;
            const matches = tournamentData.matches || [];

            const upcoming = matches.filter(m =>
                m.status !== "played" && (fixtureFilter === "ALL" || m.group === fixtureFilter)
            );
            const played = matches.filter(m =>
                m.status === "played" && (resultFilter === "ALL" || m.group === resultFilter)
            );

            renderMatchList("fixtures-container", upcoming, false, "No upcoming fixtures scheduled.");
            renderMatchList("results-container", played, true, "No match results recorded yet.");
        }

        function renderMatchList(containerId, list, isPlayed, emptyMsg) {
            const container = document.getElementById(containerId);
            if (!list.length) {
                container.innerHTML = `<div class="status-bar">${emptyMsg}</div>`;
                return;
            }

            container.innerHTML = list.map(m => `
                <div class="match-card">
                    <div class="match-meta">
                        <span><strong>${escapeHtml(m.group)}</strong> • ${escapeHtml(m.round || "Match")}</span>
                        <span>${escapeHtml(m.date || "")}</span>
                    </div>
                    <div class="match-body">
                        <div class="team-home">${escapeHtml(m.home)}</div>
                        <div class="score-box ${isPlayed ? 'played' : 'upcoming'}">
                            ${isPlayed ? `${m.homeScore} - ${m.awayScore}` : 'VS'}
                        </div>
                        <div class="team-away">${escapeHtml(m.away)}</div>
                    </div>
                </div>
            `).join("");
        }

        function switchTab(sectionId, btn) {
            document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            document.getElementById(sectionId).classList.add("active");
            btn.classList.add("active");
        }

        function escapeHtml(str) {
            return String(str ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, '&#39;');
        }

        // Start the application
        loadData();
    </script>
</body>
</html>
