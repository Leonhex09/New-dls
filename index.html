<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DLS Tournament Hub</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: #131a2a;
            --bg-card-hover: #1a2338;
            --accent: #00e676;
            --accent-glow: rgba(0, 230, 118, 0.25);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #232d42;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.4; padding-bottom: 50px; }

        header {
            background: linear-gradient(135deg, #101726 0%, #090d16 100%);
            border-bottom: 1px solid var(--border);
            padding: 20px 16px;
            text-align: center;
        }

        .badge {
            display: inline-block; background: var(--accent-glow); color: var(--accent);
            border: 1px solid var(--accent); font-size: 0.72rem; font-weight: 700;
            padding: 4px 10px; border-radius: 20px; text-transform: uppercase; margin-bottom: 6px;
        }

        header h1 { font-size: 1.4rem; font-weight: 800; }
        header p { color: var(--text-muted); font-size: 0.8rem; margin-top: 4px; }

        .knockout-active-banner {
            background: linear-gradient(135deg, rgba(0,230,118,0.15) 0%, rgba(19,26,42,0.9) 100%);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 12px;
            margin: 14px auto 0 auto;
            max-width: 850px;
            text-align: center;
            display: none;
        }
        .knockout-active-banner h3 { color: var(--accent); font-size: 0.95rem; font-weight: 800; margin-bottom: 2px; }
        .knockout-active-banner p { color: var(--text-muted); font-size: 0.75rem; }

        .tabs {
            display: flex; justify-content: center; gap: 6px; margin: 14px auto; padding: 0 10px; max-width: 850px; flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border);
            padding: 9px 12px; border-radius: 8px; font-weight: 600; font-size: 0.82rem; cursor: pointer; transition: all 0.2s;
        }

        .tab-btn:hover { background: var(--bg-card-hover); color: var(--text-main); }
        .tab-btn.active { background: var(--accent); color: #050a14; border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

        .container { max-width: 850px; margin: 0 auto; padding: 0 10px; }
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .group-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
        .group-header { background: rgba(255,255,255,0.02); padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .group-header h2 { font-size: 0.95rem; color: var(--accent); font-weight: 800; }

        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.82rem; }
        th { background: rgba(0,0,0,0.2); color: var(--text-muted); font-weight: 600; padding: 9px 4px; font-size: 0.72rem; text-transform: uppercase; }
        td { padding: 9px 4px; border-top: 1px solid var(--border); }
        th.team-col, td.team-col { text-align: left; padding-left: 12px; font-weight: 600; min-width: 120px; }

        .pos-badge { display: inline-block; width: 20px; height: 20px; line-height: 20px; border-radius: 5px; font-size: 0.72rem; font-weight: 700; background: #1e293b; }
        .qualify-top .pos-badge { background: var(--accent-glow); color: var(--accent); border: 1px solid var(--accent); }
        .pts-col { font-weight: 800; color: var(--accent); }

        .filter-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .filter-select { flex: 1; background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); padding: 8px; border-radius: 8px; font-size: 0.82rem; outline: none; }

        .match-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
            padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px;
        }
        .match-meta { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px; }
        .match-venue { font-size: 0.72rem; color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: 4px; }
        
        .match-body { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 4px 0; }
        .team-side-container { display: flex; flex-direction: column; }
        .team-home { text-align: right; font-weight: 700; font-size: 0.88rem; }
        .team-away { text-align: left; font-weight: 700; font-size: 0.88rem; }
        .manager-name { font-size: 0.68rem; color: var(--text-muted); font-weight: 500; }
        .manager-home { text-align: right; }
        .manager-away { text-align: left; }

        .score-box { background: #090d16; border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px; font-weight: 800; font-size: 0.95rem; text-align: center; min-width: 65px; }
        .score-box.upcoming { color: var(--warning); font-size: 0.78rem; }
        .score-box.played { color: var(--accent); border-color: rgba(0,230,118,0.4); }

        /* Stats & Predictor Panel */
        .stats-insights-box {
            background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px;
            padding: 8px 10px; margin-top: 6px; font-size: 0.75rem; display: flex; flex-direction: column; gap: 6px;
        }
        .insights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; text-align: center; font-size: 0.7rem; color: var(--text-muted); background: #0d1320; padding: 6px; border-radius: 6px; }
        .insights-grid strong { color: var(--text-main); display: block; font-size: 0.8rem; }

        .predictor-title { display: flex; justify-content: space-between; color: var(--text-muted); font-weight: 600; font-size: 0.72rem; }
        .predictor-bar-container { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: #1e293b; gap: 1px; }
        .bar-home { background: var(--accent); transition: width 0.3s; }
        .bar-draw { background: var(--warning); transition: width 0.3s; }
        .bar-away { background: #3b82f6; transition: width 0.3s; }
        .predictor-stats-text { display: flex; justify-content: space-between; font-weight: 700; font-size: 0.7rem; }

        .knockout-hub { display: flex; flex-direction: column; gap: 20px; padding: 4px 0; }
        .knockout-stage-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
        .knockout-stage-title { font-size: 0.95rem; font-weight: 800; color: var(--accent); text-transform: uppercase; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        
        .knockout-match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 600px) { .knockout-match-grid { grid-template-columns: 1fr; } }

        .status-bar { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.82rem; }
        footer { text-align: center; color: var(--text-muted); font-size: 0.72rem; margin-top: 30px; }
    </style>
</head>
<body>

    <header>
        <div class="badge" id="season-badge">DLS CHAMPIONSHIP</div>
        <h1 id="tournament-title">DLS Tournament Hub</h1>
        <p id="last-updated">Loading live data...</p>
        
        <div id="knockout-banner" class="knockout-active-banner">
            <h3>⚡ TOURNAMENT FINALS STAGE ACTIVE</h3>
            <p>Semi-finals complete. The tournament has advanced exclusively to the Grand Final!</p>
        </div>
    </header>

    <div class="tabs" id="main-tabs">
        <button class="tab-btn active" id="tab-standings-btn" onclick="switchTab('standings', this)">Standings</button>
        <button class="tab-btn" id="tab-fixtures-btn" onclick="switchTab('fixtures', this)">Fixtures</button>
        <button class="tab-btn" id="tab-results-btn" onclick="switchTab('results', this)">Results</button>
        <button class="tab-btn" id="bracket-tab-btn" onclick="switchTab('bracket', this)" style="display:none;">🏆 Final Hub</button>
    </div>

    <div class="container">
        <!-- STANDINGS SECTION -->
        <div id="standings" class="section active">
            <div id="standings-container"></div>
        </div>

        <!-- FIXTURES SECTION -->
        <div id="fixtures" class="section">
            <div class="filter-row">
                <select id="fixture-group-filter" class="filter-select" onchange="renderMatches()"></select>
                <select id="fixture-matchday-filter" class="filter-select" onchange="renderMatches()"></select>
            </div>
            <div id="fixtures-container"></div>
        </div>

        <!-- RESULTS SECTION -->
        <div id="results" class="section">
            <div class="filter-row">
                <select id="result-group-filter" class="filter-select" onchange="renderMatches()"></select>
                <select id="result-matchday-filter" class="filter-select" onchange="renderMatches()"></select>
            </div>
            <div id="results-container"></div>
        </div>

        <!-- FULL FINALS HUB SECTION -->
        <div id="bracket" class="section">
            <div id="bracket-container"></div>
        </div>
    </div>

    <footer>Powered by GitHub Pages • DLS Tournament System</footer>

    <script>
        const GITHUB_RAW_URL = "https://raw.githubusercontent.com/Leonhex09/New-dls/main/data.json";
        let tournamentData = null;

        async function loadData() {
            try {
                const res = await fetch(GITHUB_RAW_URL + `?t=${Date.now()}`, { cache: "no-store" });
                if (res.ok) { tournamentData = await res.json(); initApp(); return; }
            } catch (e) {}

            try {
                const res = await fetch(`data.json?t=${Date.now()}`, { cache: "no-store" });
                if (!res.ok) throw new Error();
                tournamentData = await res.json();
                initApp();
            } catch (err) {
                document.getElementById("last-updated").textContent = "Waiting for data.json from Admin Panel...";
                document.getElementById("standings-container").innerHTML = `<div class="status-bar">No tournament data found. Please push updates from your Admin Panel.</div>`;
            }
        }

        function initApp() {
            document.getElementById("tournament-title").textContent = tournamentData.tournamentName || "DLS Tournament";
            document.getElementById("season-badge").textContent = tournamentData.season || "DLS LEAGUE";
            document.getElementById("last-updated").textContent = `Updated: ${tournamentData.lastUpdated || "Just now"}`;

            populateFilters();
            renderStandings();
            renderMatches();
            checkAndRenderKnockoutHub();
        }

        function populateFilters() {
            const groups = (tournamentData.groups || []).map(g => g.name);
            const matches = tournamentData.matches || [];
            
            let matchdays = [...new Set(matches.filter(m => !m.round.includes("Semi") && !m.round.includes("Final") && !m.round.includes("Quarter")).map(m => m.round))];
            matchdays.sort((a, b) => {
                const numA = parseInt(a.replace(/[^0-9]/g, '')) || 0;
                const numB = parseInt(b.replace(/[^0-9]/g, '')) || 0;
                return numA - numB;
            });

            ["fixture-group-filter", "result-group-filter"].forEach(id => {
                const sel = document.getElementById(id);
                sel.innerHTML = groups.map(g => `<option value="${g}">${g}</option>`).join("");
            });

            ["fixture-matchday-filter", "result-matchday-filter"].forEach(id => {
                const sel = document.getElementById(id);
                sel.innerHTML = matchdays.map(md => `<option value="${md}">${md}</option>`).join("");
            });
        }

        function getTeamManager(teamName) {
            if (!tournamentData.managers) return "Manager TBD";
            return tournamentData.managers[teamName] || "Manager TBD";
        }

        function calculateGroupTable(group) {
            const stats = {};
            (group.teams || []).forEach(t => stats[t] = { team: t, mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 });

            (tournamentData.matches || [])
                .filter(m => m.group === group.name && m.status === "played" && m.homeScore !== null && m.awayScore !== null)
                .forEach(m => {
                    const hs = Number(m.homeScore), as = Number(m.awayScore);
                    if (!stats[m.home]) stats[m.home] = { team: m.home, mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
                    if (!stats[m.away]) stats[m.away] = { team: m.away, mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };

                    stats[m.home].mp++; stats[m.away].mp++;
                    stats[m.home].gf += hs; stats[m.home].ga += as;
                    stats[m.away].gf += as; stats[m.away].ga += hs;

                    if (hs > as) { stats[m.home].w++; stats[m.home].pts += 3; stats[m.away].l++; }
                    else if (hs < as) { stats[m.away].w++; stats[m.away].pts += 3; stats[m.home].l++; }
                    else { stats[m.home].d++; stats[m.away].d++; stats[m.home].pts += 1; stats[m.away].pts += 1; }
                });

            return Object.values(stats).map(t => ({ ...t, gd: t.gf - t.ga }))
                .sort((a, b) => b.pts !== a.pts ? b.pts - a.pts : b.gd !== a.gd ? b.gd - a.gd : b.gf - a.gf);
        }

        function getTeamRecord(teamName) {
            let rec = { mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 };
            (tournamentData.groups || []).forEach(g => {
                const table = calculateGroupTable(g);
                const found = table.find(t => t.team === teamName);
                if (found) rec = found;
            });
            return rec;
        }

        function calculateWinPredictor(homeTeam, awayTeam) {
            const homeRec = getTeamRecord(homeTeam);
            const awayRec = getTeamRecord(awayTeam);

            let homeScoreVal = 10 + (homeRec.pts * 3) + (homeRec.gd * 2) + homeRec.gf;
            let awayScoreVal = 10 + (awayRec.pts * 3) + (awayRec.gd * 2) + awayRec.gf;

            const total = homeScoreVal + awayScoreVal + 15; 
            let homePct = Math.round((homeScoreVal / total) * 100);
            let awayPct = Math.round((awayScoreVal / total) * 100);
            let drawPct = 100 - (homePct + awayPct);
            if (drawPct < 10) drawPct = 10;
            if (homePct + awayPct + drawPct !== 100) homePct = 100 - (awayPct + drawPct);

            return { 
                homePct, drawPct, awayPct,
                homeStats: `${homeRec.w}W - ${homeRec.d}D - ${homeRec.l}L (${homeRec.pts} PTS)`,
                awayStats: `${awayRec.w}W - ${awayRec.d}D - ${awayRec.l}L (${awayRec.pts} PTS)`
            };
        }

        function renderStandings() {
            const container = document.getElementById("standings-container");
            container.innerHTML = "";
            const qualify = tournamentData.qualifyCount ?? 2;

            if (!tournamentData.groups || !tournamentData.groups.length) {
                container.innerHTML = `<div class="status-bar">No groups created yet.</div>`;
                return;
            }

            tournamentData.groups.forEach(group => {
                const table = calculateGroupTable(group);
                const rows = table.map((row, idx) => {
                    const pos = idx + 1;
                    const mgr = getTeamManager(row.team);
                    return `
                        <tr class="${pos <= qualify ? 'qualify-top' : ''}">
                            <td><span class="pos-badge">${pos}</span></td>
                            <td class="team-col">
                                <strong>${escapeHtml(row.team)}</strong>
                                <div style="font-size:0.68rem; color:var(--text-muted); font-weight:normal;">Coach: ${escapeHtml(mgr)}</div>
                            </td>
                            <td>${row.mp}</td><td>${row.w}</td><td>${row.d}</td><td>${row.l}</td>
                            <td>${row.gf}</td><td>${row.ga}</td><td>${row.gd > 0 ? '+' + row.gd : row.gd}</td>
                            <td class="pts-col">${row.pts}</td>
                        </tr>
                    `;
                }).join("");

                container.innerHTML += `
                    <div class="group-card">
                        <div class="group-header">
                            <h2>${escapeHtml(group.name)}</h2>
                            <span style="font-size:0.72rem; color:var(--text-muted);">Top ${qualify} Qualify</span>
                        </div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr><th>#</th><th class="team-col">Team / Coach</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr>
                                </thead>
                                <tbody>${rows || '<tr><td colspan="10" style="padding:15px; color:var(--text-muted);">No teams</td></tr>'}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            });
        }

        function renderMatches() {
            const fGroup = document.getElementById("fixture-group-filter").value;
            const fMatchday = document.getElementById("fixture-matchday-filter").value;
            
            const rGroup = document.getElementById("result-group-filter").value;
            const rMatchday = document.getElementById("result-matchday-filter").value;

            const matches = tournamentData.matches || [];

            const upcoming = matches.filter(m => 
                m.status !== "played" && 
                !m.round.includes("Semi") && !m.round.includes("Final") && !m.round.includes("Quarter") &&
                m.group === fGroup && 
                m.round === fMatchday
            );

            const played = matches.filter(m => 
                m.status === "played" && 
                !m.round.includes("Semi") && !m.round.includes("Final") && !m.round.includes("Quarter") &&
                m.group === rGroup && 
                m.round === rMatchday
            );

            renderMatchList("fixtures-container", upcoming, false, "No upcoming fixtures for this selection.");
            renderMatchList("results-container", played, true, "No results recorded for this selection.");
        }

        function renderMatchList(id, list, isPlayed, emptyMsg) {
            const container = document.getElementById(id);
            if (!list.length) { container.innerHTML = `<div class="status-bar">${emptyMsg}</div>`; return; }
            container.innerHTML = list.map(m => {
                let insightsHtml = '';
                const venueText = m.venue ? `📍 Venue: ${escapeHtml(m.venue)}` : `🏟️ DLS Stadium`;
                const homeMgr = getTeamManager(m.home);
                const awayMgr = getTeamManager(m.away);

                if (!isPlayed) {
                    const analysis = calculateWinPredictor(m.home, m.away);
                    insightsHtml = `
                        <div class="stats-insights-box">
                            <div class="insights-grid">
                                <div>${escapeHtml(m.home)} Form: <strong>${analysis.homeStats}</strong></div>
                                <div>${escapeHtml(m.away)} Form: <strong>${analysis.awayStats}</strong></div>
                            </div>
                            <div class="predictor-title"><span>Win Predictor & Probabilities</span><span>Performance Based</span></div>
                            <div class="predictor-bar-container">
                                <div class="bar-home" style="width: ${analysis.homePct}%"></div>
                                <div class="bar-draw" style="width: ${analysis.drawPct}%"></div>
                                <div class="bar-away" style="width: ${analysis.awayPct}%"></div>
                            </div>
                            <div class="predictor-stats-text">
                                <span style="color:var(--accent);">${escapeHtml(m.home)}: ${analysis.homePct}%</span>
                                <span style="color:var(--warning);">Draw: ${analysis.drawPct}%</span>
                                <span style="color:#3b82f6;">${escapeHtml(m.away)}: ${analysis.awayPct}%</span>
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="match-card">
                        <div class="match-meta">
                            <span><strong>${escapeHtml(m.group)}</strong> • ${escapeHtml(m.round || "Match")}</span>
                            <span class="match-venue">${venueText}</span>
                        </div>
                        <div style="font-size:0.7rem; color:var(--text-muted); margin-bottom:-2px;">📅 Date: ${escapeHtml(m.date || "TBD")}</div>
                        <div class="match-body">
                            <div class="team-side-container">
                                <div class="team-home">${escapeHtml(m.home)}</div>
                                <div class="manager-name manager-home">Coach: ${escapeHtml(homeMgr)}</div>
                            </div>
                            <div class="score-box ${isPlayed ? 'played' : 'upcoming'}">${isPlayed ? `${m.homeScore} - ${m.awayScore}` : 'VS'}</div>
                            <div class="team-side-container">
                                <div class="team-away">${escapeHtml(m.away)}</div>
                                <div class="manager-name manager-away">Coach: ${escapeHtml(awayMgr)}</div>
                            </div>
                        </div>
                        ${insightsHtml}
                    </div>
                `;
            }).join("");
        }

        function checkAndRenderKnockoutHub() {
            const matches = tournamentData.matches || [];
            const koMatches = matches.filter(m => m.round.includes("Semi") || m.round.includes("Final") || m.round.includes("Quarter"));
            
            const sf1 = koMatches.find(m => m.round === "Semi-Final 1");
            const sf2 = koMatches.find(m => m.round === "Semi-Final 2");
            const final = koMatches.find(m => m.round === "Final");

            const sf1Played = sf1 && sf1.status === "played";
            const sf2Played = sf2 && sf2.status === "played";
            const reachedFinals = sf1Played && sf2Played;

            const bracketBtn = document.getElementById("bracket-tab-btn");
            bracketBtn.style.display = "block";

            if (reachedFinals) {
                document.getElementById("tab-standings-btn").style.display = "none";
                document.getElementById("tab-fixtures-btn").style.display = "none";
                document.getElementById("tab-results-btn").style.display = "none";
                document.getElementById("knockout-banner").style.display = "block";
                
                bracketBtn.textContent = "🏆 Grand Final";
                switchTab('bracket', bracketBtn);

                let finalHome = final ? final.home : "Winner SF 1";
                let finalAway = final ? final.away : "Winner SF 2";

                if (sf1 && sf1.homeScore !== sf1.awayScore) {
                    finalHome = Number(sf1.homeScore) > Number(sf1.awayScore) ? sf1.home : sf1.away;
                }
                if (sf2 && sf2.homeScore !== sf2.awayScore) {
                    finalAway = Number(sf2.homeScore) > Number(sf2.awayScore) ? sf2.home : sf2.away;
                }

                const homeMgr = getTeamManager(finalHome);
                const awayMgr = getTeamManager(finalAway);

                let finalInsightsHtml = '';
                if (!final || final.status !== 'played') {
                    const analysis = calculateWinPredictor(finalHome, finalAway);
                    finalInsightsHtml = `
                        <div class="stats-insights-box" style="margin-top:10px;">
                            <div class="predictor-title"><span>Championship Win Predictor</span><span>Stats Based</span></div>
                            <div class="predictor-bar-container">
                                <div class="bar-home" style="width: ${analysis.homePct}%"></div>
                                <div class="bar-draw" style="width: ${analysis.drawPct}%"></div>
                                <div class="bar-away" style="width: ${analysis.awayPct}%"></div>
                            </div>
                            <div class="predictor-stats-text">
                                <span style="color:var(--accent);">${escapeHtml(finalHome)}: ${analysis.homePct}%</span>
                                <span style="color:var(--warning);">Draw: ${analysis.drawPct}%</span>
                                <span style="color:#3b82f6;">${escapeHtml(finalAway)}: ${analysis.awayPct}%</span>
                            </div>
                        </div>
                    `;
                }

                const bContainer = document.getElementById("bracket-container");
                bContainer.innerHTML = `
                    <div class="knockout-hub">
                        <div class="knockout-stage-section" style="border-color:var(--accent); max-width: 550px; margin: 0 auto; width: 100%;">
                            <div class="knockout-stage-title" style="color:var(--accent);"><span>🏆 Championship Grand Final</span></div>
                            <div class="match-card" style="margin-bottom:0; border-color:var(--accent);">
                                <div class="match-meta">
                                    <span>Decider Match • DLS Championship</span>
                                    <span class="match-venue">📍 ${escapeHtml(final && final.venue ? final.venue : 'Grand Stadium')}</span>
                                </div>
                                <div class="match-body">
                                    <div class="team-side-container">
                                        <div class="team-home">${escapeHtml(finalHome)}</div>
                                        <div class="manager-name manager-home">Coach: ${escapeHtml(homeMgr)}</div>
                                    </div>
                                    <div class="score-box ${final && final.status === 'played' ? 'played' : 'upcoming'}">${final && final.status === 'played' ? `${final.homeScore} - ${final.awayScore}` : 'VS'}</div>
                                    <div class="team-side-container">
                                        <div class="team-away">${escapeHtml(finalAway)}</div>
                                        <div class="manager-name manager-away">Coach: ${escapeHtml(awayMgr)}</div>
                                    </div>
                                </div>
                                ${finalInsightsHtml}
                            </div>
                        </div>
                    </div>
                `;
            } else {
                const groupMatches = matches.filter(m => !m.round.includes("Semi") && !m.round.includes("Final") && !m.round.includes("Quarter"));
                const allGroupPlayed = groupMatches.length > 0 && groupMatches.every(m => m.status === "played");
                
                if (allGroupPlayed) {
                    document.getElementById("knockout-banner").style.display = "block";
                    switchTab('bracket', bracketBtn);
                }

                const sf1Data = sf1 || { home: "TBD", away: "TBD", homeScore: null, awayScore: null, status: "upcoming" };
                const sf2Data = sf2 || { home: "TBD", away: "TBD", homeScore: null, awayScore: null, status: "upcoming" };
                const finalData = final || { home: "Winner SF 1", away: "Winner SF 2", homeScore: null, awayScore: null, status: "upcoming" };

                let finalHome = finalData.home;
                let finalAway = finalData.away;
                if (sf1Data.status === "played" && sf1Data.homeScore !== sf1Data.awayScore) {
                    finalHome = Number(sf1Data.homeScore) > Number(sf1Data.awayScore) ? sf1Data.home : sf1Data.away;
                }
                if (sf2Data.status === "played" && sf2Data.homeScore !== sf2Data.awayScore) {
                    finalAway = Number(sf2Data.homeScore) > Number(sf2Data.awayScore) ? sf2Data.home : sf2Data.away;
                }

                const sf1HomeMgr = getTeamManager(sf1Data.home);
                const sf1AwayMgr = getTeamManager(sf1Data.away);
                const sf2HomeMgr = getTeamManager(sf2Data.home);
                const sf2AwayMgr = getTeamManager(sf2Data.away);
                const finalHomeMgr = getTeamManager(finalHome);
                const finalAwayMgr = getTeamManager(finalAway);

                const bContainer = document.getElementById("bracket-container");
                bContainer.innerHTML = `
                    <div class="knockout-hub">
                        <div class="knockout-stage-section">
                            <div class="knockout-stage-title"><span>🔥 Semi-Finals</span></div>
                            <div class="knockout-match-grid">
                                <div class="match-card" style="margin-bottom:0;">
                                    <div class="match-meta">
                                        <span>Semi-Final 1</span>
                                        <span class="match-venue">📍 ${escapeHtml(sf1Data.venue || 'Stadium A')}</span>
                                    </div>
                                    <div class="match-body">
                                        <div class="team-side-container">
                                            <div class="team-home">${escapeHtml(sf1Data.home)}</div>
                                            <div class="manager-name manager-home">Coach: ${escapeHtml(sf1HomeMgr)}</div>
                                        </div>
                                        <div class="score-box ${sf1Data.status === 'played' ? 'played' : 'upcoming'}">${sf1Data.status === 'played' ? `${sf1Data.homeScore} - ${sf1Data.awayScore}` : 'VS'}</div>
                                        <div class="team-side-container">
                                            <div class="team-away">${escapeHtml(sf1Data.away)}</div>
                                            <div class="manager-name manager-away">Coach: ${escapeHtml(sf1AwayMgr)}</div>
                                        </div>
                                    </div>
                                </div>
                                <div class="match-card" style="margin-bottom:0;">
                                    <div class="match-meta">
                                        <span>Semi-Final 2</span>
                                        <span class="match-venue">📍 ${escapeHtml(sf2Data.venue || 'Stadium B')}</span>
                                    </div>
                                    <div class="match-body">
                                        <div class="team-side-container">
                                            <div class="team-home">${escapeHtml(sf2Data.home)}</div>
                                            <div class="manager-name manager-home">Coach: ${escapeHtml(sf2HomeMgr)}</div>
                                        </div>
                                        <div class="score-box ${sf2Data.status === 'played' ? 'played' : 'upcoming'}">${sf2Data.status === 'played' ? `${sf2Data.homeScore} - ${sf2Data.awayScore}` : 'VS'}</div>
                                        <div class="team-side-container">
                                            <div class="team-away">${escapeHtml(sf2Data.away)}</div>
                                            <div class="manager-name manager-away">Coach: ${escapeHtml(sf2AwayMgr)}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="knockout-stage-section" style="border-color:var(--accent);">
                            <div class="knockout-stage-title" style="color:var(--accent);"><span>🏆 Championship Final</span></div>
                            <div class="match-card" style="margin-bottom:0; border-color:var(--accent);">
                                <div class="match-meta">
                                    <span>Grand Final</span>
                                    <span class="match-venue">📍 ${escapeHtml(finalData.venue || 'Championship Arena')}</span>
                                </div>
                                <div class="match-body">
                                    <div class="team-side-container">
                                        <div class="team-home">${escapeHtml(finalHome)}</div>
                                        <div class="manager-name manager-home">Coach: ${escapeHtml(finalHomeMgr)}</div>
                                    </div>
                                    <div class="score-box ${finalData.status === 'played' ? 'played' : 'upcoming'}">${finalData.status === 'played' ? `${finalData.homeScore} - ${finalData.awayScore}` : 'VS'}</div>
                                    <div class="team-side-container">
                                        <div class="team-away">${escapeHtml(finalAway)}</div>
                                        <div class="manager-name manager-away">Coach: ${escapeHtml(finalAwayMgr)}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function switchTab(id, btn) {
            document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            document.getElementById(id).classList.add("active");
            if (btn) btn.classList.add("active");
        }

        function escapeHtml(str) {
            return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        loadData();
    </script>
</body>
</html>
