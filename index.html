<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DLS Tournament Hub</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: #131a2a;
            --bg-card-hover: #1a2338;
            --accent: #00e676;
            --accent-glow: rgba(0, 230, 118, 0.3);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #232d42;
            --warning: #f59e0b;
            --win: #00e676;
            --draw: #f59e0b;
            --loss: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.4; padding-bottom: 50px; }

        header {
            background: linear-gradient(135deg, #101726 0%, #090d16 100%);
            border-bottom: 1px solid var(--border);
            padding: 20px 16px;
            text-align: center;
        }

        .badge {
            display: inline-block; background: var(--accent-glow); color: var(--accent);
            border: 1px solid var(--accent); font-size: 0.72rem; font-weight: 700;
            padding: 4px 10px; border-radius: 20px; text-transform: uppercase; margin-bottom: 6px;
        }

        header h1 { font-size: 1.4rem; font-weight: 800; }
        header p { color: var(--text-muted); font-size: 0.8rem; margin-top: 4px; }

        @keyframes borderGlowPulse {
            0% { border-image: linear-gradient(to bottom, #00e676 0%, rgba(0, 230, 118, 0.3) 70%, transparent 100%) 1; }
            33% { border-image: linear-gradient(to bottom, #3b82f6 0%, rgba(59, 130, 246, 0.3) 70%, transparent 100%) 1; }
            66% { border-image: linear-gradient(to bottom, #f59e0b 0%, rgba(245, 158, 11, 0.3) 70%, transparent 100%) 1; }
            100% { border-image: linear-gradient(to bottom, #00e676 0%, rgba(0, 230, 118, 0.3) 70%, transparent 100%) 1; }
        }

        @keyframes textPulsate {
            0% { opacity: 0.85; }
            50% { opacity: 1; text-shadow: 0 0 8px rgba(0,230,118,0.4); }
            100% { opacity: 0.85; }
        }

        .commentary-lighting-box {
            position: relative;
            background: var(--bg-card);
            border-top: none;
            border-bottom: none;
            border-left: 2px solid transparent;
            border-right: 2px solid transparent;
            animation: borderGlowPulse 6s infinite ease-in-out;
            border-radius: 12px;
            padding: 16px;
            margin: 16px auto 0 auto;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .commentary-header {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .broadcast-live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ef4444;
            animation: pulseDot 1.5s infinite;
        }
        @keyframes pulseDot {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 12px #ef4444; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .commentary-body {
            font-size: 0.88rem;
            color: var(--text-main);
            white-space: pre-wrap;
            line-height: 1.5;
            animation: textPulsate 3s infinite ease-in-out;
        }

        .stats-insights-box {
            background: linear-gradient(135deg, #131a2a 0%, #0d1320 100%);
            border: 1px solid rgba(0, 230, 118, 0.4);
            border-radius: 12px;
            padding: 14px;
            margin-top: 12px;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }
        .insights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: center; }
        .predictor-team-stat-card { background: #090d16; border: 1px solid var(--border); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
        .predictor-team-label { font-size: 0.68rem; color: var(--text-muted); font-weight: 700; }
        .predictor-form-capsules { display: flex; justify-content: center; gap: 4px; align-items: center; }
        .predictor-mini-badge { font-weight: 900; font-size: 0.65rem; width: 18px; height: 18px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #fff; }
        .predictor-mini-badge.w { background: var(--win); color: #050a14; }
        .predictor-mini-badge.d { background: var(--draw); color: #050a14; }
        .predictor-mini-badge.l { background: var(--loss); color: #fff; }

        .predictor-title {
            display: flex; justify-content: space-between; color: var(--accent); font-weight: 900; font-size: 0.78rem; text-transform: uppercase; border-bottom: 1px solid rgba(0, 230, 118, 0.2); padding-bottom: 6px;
        }
        .predictor-bar-container { position: relative; display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: #090d16; padding: 1px; border: 1px solid var(--border); gap: 2px; }
        .bar-home { background: var(--win); border-radius: 6px 0 0 6px; display: flex; align-items: center; justify-content: center; color: #050a14; font-weight: 900; font-size: 0.62rem; }
        .bar-draw { background: var(--draw); display: flex; align-items: center; justify-content: center; color: #050a14; font-weight: 900; font-size: 0.62rem; }
        .bar-away { background: #3b82f6; border-radius: 0 6px 6px 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 0.62rem; }
        .predictor-legend-row { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); font-weight: 700; padding: 0 2px; }

        .detailed-form-box {
            background: linear-gradient(135deg, #131a2a 0%, #0d1320 100%);
            border: 1px solid rgba(0, 230, 118, 0.4); border-radius: 14px; padding: 18px; margin: 18px auto 0 auto; max-width: 600px; width: 100%;
        }
        .form-box-title { font-size: 0.88rem; font-weight: 900; color: var(--accent); text-transform: uppercase; margin-bottom: 14px; border-bottom: 1px solid rgba(0, 230, 118, 0.2); padding-bottom: 8px; }
        .form-teams-grid { display: flex; flex-direction: column; gap: 12px; }
        .team-form-column { background: #090d16; border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
        .team-form-name { font-size: 0.9rem; font-weight: 900; margin-bottom: 10px; color: var(--text-main); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .team-form-scroll-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
        .match-scoreline-card { flex: 0 0 calc(50% - 4px); scroll-snap-align: start; display: flex; flex-direction: column; justify-content: space-between; font-size: 0.75rem; padding: 8px 10px; background: linear-gradient(135deg, #131a2a 0%, #1a2338 100%); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; }
        .scoreline-info { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
        .scoreline-opponent { font-weight: 800; color: var(--text-main); font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .scoreline-round { font-size: 0.62rem; color: var(--text-muted); }
        .scoreline-bottom { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.04); padding-top: 4px; }
        .scoreline-score { font-weight: 900; font-size: 0.78rem; color: var(--accent); background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px; }
        .scoreline-badge { font-weight: 900; font-size: 0.68rem; width: 20px; height: 20px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #fff; }
        .scoreline-badge.w { background: var(--win); color: #050a14; }
        .scoreline-badge.d { background: var(--draw); color: #050a14; }
        .scoreline-badge.l { background: var(--loss); color: #fff; }

        .knockout-active-banner {
            background: linear-gradient(135deg, rgba(0,230,118,0.15) 0%, rgba(19,26,42,0.9) 100%);
            border: 1px solid var(--accent); border-radius: 10px; padding: 12px; margin: 14px auto 0 auto; max-width: 850px; text-align: center; display: none;
        }
        .knockout-active-banner h3 { color: var(--accent); font-size: 0.95rem; font-weight: 800; margin-bottom: 2px; }
        .knockout-active-banner p { color: var(--text-muted); font-size: 0.75rem; }

        .tabs { display: flex; justify-content: center; gap: 6px; margin: 14px auto; padding: 0 10px; max-width: 850px; flex-wrap: wrap; }
        .tab-btn { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border); padding: 9px 12px; border-radius: 8px; font-weight: 600; font-size: 0.82rem; cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { background: var(--bg-card-hover); color: var(--text-main); }
        .tab-btn.active { background: var(--accent); color: #050a14; border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

        .container { max-width: 850px; margin: 0 auto; padding: 0 10px; }
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .group-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
        .group-header { background: rgba(255,255,255,0.02); padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .group-header h2 { font-size: 0.95rem; color: var(--accent); font-weight: 800; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.82rem; }
        th { background: rgba(0,0,0,0.2); color: var(--text-muted); font-weight: 600; padding: 9px 4px; font-size: 0.72rem; text-transform: uppercase; }
        td { padding: 9px 4px; border-top: 1px solid var(--border); }
        th.team-col, td.team-col { text-align: left; padding-left: 12px; font-weight: 600; min-width: 120px; }
        .pos-badge { display: inline-block; width: 20px; height: 20px; line-height: 20px; border-radius: 5px; font-size: 0.72rem; font-weight: 700; background: #1e293b; }
        .qualify-top .pos-badge { background: var(--accent-glow); color: var(--accent); border: 1px solid var(--accent); }
        .pts-col { font-weight: 800; color: var(--accent); }

        .filter-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .filter-select { flex: 1; background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); padding: 8px; border-radius: 8px; font-size: 0.82rem; outline: none; }

        .match-card {
            background: linear-gradient(135deg, #131a2a 0%, #0d1320 100%);
            border: 1px solid rgba(0, 230, 118, 0.3); border-radius: 12px; padding: 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 4px 18px rgba(0,0,0,0.4);
        }
        .match-meta { display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 6px; font-weight: 600; }
        .match-venue { font-size: 0.74rem; color: var(--accent); font-weight: 700; display: flex; align-items: center; gap: 4px; }
        .match-body { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin: 4px 0; }
        .team-side-container { display: flex; flex-direction: column; gap: 3px; }
        .team-home { text-align: right; font-weight: 800; font-size: 0.92rem; color: var(--text-main); }
        .team-away { text-align: left; font-weight: 800; font-size: 0.92rem; color: var(--text-main); }
        .manager-name { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; }
        .manager-home { text-align: right; }
        .manager-away { text-align: left; }
        .score-box { background: #090d16; border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; font-weight: 900; font-size: 1rem; text-align: center; min-width: 70px; }
        .score-box.upcoming { color: var(--warning); font-size: 0.82rem; border-color: rgba(245,158,11,0.3); }
        .score-box.played { color: var(--accent); border-color: rgba(0,230,118,0.5); }

        .grand-final-card {
            background: linear-gradient(135deg, #162238 0%, #0d1320 100%) !important; border: 2px solid var(--accent) !important; box-shadow: 0 8px 30px rgba(0, 230, 118, 0.25) !important;
        }
        .grand-final-title {
            color: var(--accent); font-size: 1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 4px;
        }

        .user-whatsapp-container { position: fixed; bottom: 20px; left: 20px; z-index: 9999; font-family: 'Segoe UI', Roboto, sans-serif; }
        .user-whatsapp-toggle-btn {
            background: #25d366; color: #fff; padding: 12px 18px; border-radius: 30px; border: none; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 0.82rem; cursor: pointer; box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4); position: relative;
        }
        .user-whatsapp-toggle-btn:hover { transform: scale(1.05); }
        .user-unread-dot {
            position: absolute; top: -4px; right: -4px; background: #ef4444; color: #fff; font-size: 0.65rem; font-weight: 900; width: 20px; height: 20px; border-radius: 50%; display: none; align-items: center; justify-content: center; border: 2px solid #090d16;
        }
        .user-unread-dot.active { display: flex; }
        .user-whatsapp-popup {
            position: absolute; bottom: 60px; left: 0; width: 320px; max-height: 460px; background: #0b141a; border: 1px solid #232d42; border-radius: 12px; display: none; flex-direction: column; box-shadow: 0 10px 35px rgba(0,0,0,0.8); overflow: hidden;
        }
        .user-whatsapp-popup.active { display: flex; }
        .u-wa-header { background: #1f2c34; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3942; }
        .u-wa-header-title { font-size: 0.85rem; font-weight: 800; color: #e9edef; display: flex; align-items: center; gap: 6px; }
        .u-wa-close-btn { background: none; border: none; color: #8696a0; font-size: 1.1rem; cursor: pointer; }
        .u-wa-messages-body { flex: 1; padding: 12px; overflow-y: auto; max-height: 290px; min-height: 220px; display: flex; flex-direction: column; gap: 8px; background: #0b141a; }
        .u-wa-bubble { max-width: 85%; padding: 8px 10px; border-radius: 8px; font-size: 0.78rem; display: flex; flex-direction: column; gap: 2px; word-break: break-word; }
        .u-wa-bubble.incoming { background: #202c33; color: #e9edef; align-self: flex-start; border-top-left-radius: 0; }
        .u-wa-bubble.outgoing { background: #005c4b; color: #e9edef; align-self: flex-end; border-top-right-radius: 0; }
        .u-wa-sender { font-size: 0.68rem; font-weight: 700; color: #25d366; }
        .u-wa-time { font-size: 0.6rem; color: #8696a0; align-self: flex-end; margin-top: 2px; }
        .u-wa-footer { background: #1f2c34; padding: 8px 10px; display: flex; gap: 6px; align-items: center; border-top: 1px solid #2a3942; }
        .u-wa-input { flex: 1; background: #2a3942; border: none; color: #e9edef; padding: 8px 10px; border-radius: 6px; font-size: 0.78rem; outline: none; }
        .u-wa-send-btn { background: #00a884; color: #fff; border: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.85rem; }

        .status-bar { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.82rem; }
        footer { text-align: center; color: var(--text-muted); font-size: 0.72rem; margin-top: 30px; }
    </style>
</head>
<body>

    <header>
        <div class="badge" id="season-badge">DLS CHAMPIONSHIP</div>
        <h1 id="tournament-title">DLS Tournament Hub</h1>
        <p id="last-updated">Loading live data...</p>
        
        <div id="knockout-banner" class="knockout-active-banner">
            <h3>⚡ TOURNAMENT FINALS STAGE ACTIVE</h3>
            <p>Semi-finals complete. The tournament has advanced exclusively to the Grand Final!</p>
        </div>
    </header>

    <div class="tabs" id="main-tabs">
        <button class="tab-btn active" id="tab-standings-btn" onclick="switchTab('standings', this)">Standings</button>
        <button class="tab-btn" id="tab-fixtures-btn" onclick="switchTab('fixtures', this)">Fixtures</button>
        <button class="tab-btn" id="tab-results-btn" onclick="switchTab('results', this)">Results</button>
        <button class="tab-btn" id="bracket-tab-btn" onclick="switchTab('bracket', this)" style="display:none;">🏆 Final Hub</button>
    </div>

    <div class="container">
        <div id="standings" class="section active"><div id="standings-container"></div></div>
        <div id="fixtures" class="section">
            <div class="filter-row">
                <select id="fixture-group-filter" class="filter-select" onchange="renderMatches()"></select>
                <select id="fixture-matchday-filter" class="filter-select" onchange="renderMatches()"></select>
            </div>
            <div id="fixtures-container"></div>
        </div>
        <div id="results" class="section">
            <div class="filter-row">
                <select id="result-group-filter" class="filter-select" onchange="renderMatches()"></select>
                <select id="result-matchday-filter" class="filter-select" onchange="renderMatches()"></select>
            </div>
            <div id="results-container"></div>
        </div>
        <div id="bracket" class="section"><div id="bracket-container"></div></div>
    </div>

    <div class="user-whatsapp-container">
        <div id="user-whatsapp-popup" class="user-whatsapp-popup">
            <div class="u-wa-header">
                <span class="u-wa-header-title">💬 Chat with Admin</span>
                <button class="u-wa-close-btn" onclick="toggleUserChat()">&times;</button>
            </div>
            <div id="u-wa-messages-body" class="u-wa-messages-body">
                <div style="color: #8696a0; text-align: center; font-size: 0.75rem; padding: 20px;">Connecting to chat...</div>
            </div>
            <div class="u-wa-footer">
                <input type="text" id="u-wa-input" class="u-wa-input" placeholder="Type message / dispute..." onkeypress="handleUserWaKeyPress(event)">
                <button class="u-wa-send-btn" onclick="sendUserMessage()">➤</button>
            </div>
        </div>
        <button class="user-whatsapp-toggle-btn" onclick="toggleUserChat()" title="Chat with Admin">
            💬 Contact Admin
            <span id="user-unread-dot" class="user-unread-dot">0</span>
        </button>
    </div>

    <footer>Powered by GitHub Pages • DLS Tournament System</footer>

    <script>
        const GITHUB_RAW_URL = "https://raw.githubusercontent.com/Leonhex09/New-dls/main/data.json";
        let tournamentData = null;

        const BIN_ID = "6afbe4a4ffd5d16053c77e7e";
        const MASTER_KEY = "$2a$10$B85FPn9jz1K3QxcgtPbRdeNdinTlUJnKBqQg5Pj31ZE.G9D4.NzqO";
        let userChatPollInterval = null;

        window.addEventListener("DOMContentLoaded", () => {
            loadData();
            setInterval(loadData, 10000);
            setInterval(backgroundPollUnread, 6000);
        });

        async function loadData() {
            // 1. Try local storage first to prevent file:// fetch CORS/schema errors in mobile previewers
            const local = localStorage.getItem("dls_admin_draft");
            if (local) {
                try {
                    tournamentData = JSON.parse(local);
                    initApp();
                    updateLiveBroadcastPuller();
                } catch (e) {}
            }

            // 2. Try fetching from GitHub raw URL
            try {
                const res = await fetch(GITHUB_RAW_URL + `?t=${Date.now()}`, { cache: "no-store" });
                if (res.ok) { 
                    tournamentData = await res.json(); 
                    initApp(); 
                    updateLiveBroadcastPuller();
                    return; 
                }
            } catch (e) {}
        }

        function updateLiveBroadcastPuller() {
            if (!tournamentData) return;
            const broadcastEl = document.getElementById("live-broadcast-text");
            if (broadcastEl) {
                const newCommentary = (tournamentData.commentary && tournamentData.commentary.trim() !== "") 
                    ? tournamentData.commentary 
                    : "🔴 LIVE BROADCAST: Welcome to the tournament! Stay tuned here for live administrative commentary and breaking updates.";
                
                if (broadcastEl.textContent !== newCommentary) {
                    broadcastEl.textContent = newCommentary;
                }
            }
        }

        function initApp() {
            if (!tournamentData) return;
            document.getElementById("tournament-title").textContent = tournamentData.tournamentName || "DLS Tournament";
            document.getElementById("season-badge").textContent = tournamentData.season || "DLS LEAGUE";
            document.getElementById("last-updated").textContent = `Updated: ${tournamentData.lastUpdated || "Just now"}`;

            populateFilters();
            renderStandings();
            renderMatches();
            checkAndRenderKnockoutHub();
        }

        async function backgroundPollUnread() {
            const popup = document.getElementById("user-whatsapp-popup");
            if (popup.classList.contains("active")) return;

            const senderName = localStorage.getItem("dls_user_name");
            if (!senderName) return;

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { "X-Master-Key": MASTER_KEY }
                });
                const data = await res.json();
                const messages = data.record.messages || [];

                const userThread = messages.filter(m => m.sender === senderName || m.target === senderName || m.sender === "Admin");
                const adminMsgs = userThread.filter(m => m.sender === "Admin");
                const unreadSeenKey = "dls_user_last_read_" + senderName;
                const lastReadCount = Number(localStorage.getItem(unreadSeenKey) || 0);

                if (adminMsgs.length > lastReadCount) {
                    const unreadCount = adminMsgs.length - lastReadCount;
                    const dot = document.getElementById("user-unread-dot");
                    dot.textContent = unreadCount;
                    dot.classList.add("active");
                }
            } catch (e) {}
        }

        function toggleUserChat() {
            const popup = document.getElementById("user-whatsapp-popup");
            popup.classList.toggle("active");
            
            if (popup.classList.contains("active")) {
                const senderName = localStorage.getItem("dls_user_name");
                if (senderName) {
                    fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                        headers: { "X-Master-Key": MASTER_KEY }
                    }).then(res => res.json()).then(data => {
                        const messages = data.record.messages || [];
                        const adminMsgs = messages.filter(m => m.sender === senderName || m.target === senderName || m.sender === "Admin").filter(m => m.sender === "Admin");
                        localStorage.setItem("dls_user_last_read_" + senderName, adminMsgs.length);
                    });
                }
                document.getElementById("user-unread-dot").classList.remove("active");

                fetchUserMessages();
                if (!userChatPollInterval) {
                    userChatPollInterval = setInterval(fetchUserMessages, 5000);
                }
            } else {
                if (userChatPollInterval) {
                    clearInterval(userChatPollInterval);
                    userChatPollInterval = null;
                }
            }
        }

        async function fetchUserMessages() {
            const body = document.getElementById("u-wa-messages-body");
            const senderName = localStorage.getItem("dls_user_name");

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { "X-Master-Key": MASTER_KEY }
                });
                const data = await res.json();
                const messages = data.record.messages || [];

                const threadMessages = senderName 
                    ? messages.filter(m => m.sender === senderName || m.target === senderName || m.sender === "Admin")
                    : messages;

                if (threadMessages.length === 0) {
                    body.innerHTML = `<div style="color: #8696a0; text-align: center; font-size: 0.75rem; padding: 20px;">No messages yet. Send a message to the admin!</div>`;
                    return;
                }

                body.innerHTML = threadMessages.slice().reverse().map(msg => {
                    const isAdmin = msg.sender === "Admin";
                    const bubbleClass = isAdmin ? "incoming" : "outgoing";
                    return `
                        <div class="u-wa-bubble ${bubbleClass}">
                            <span class="u-wa-sender">${escapeHtml(msg.sender)}</span>
                            <span>${escapeHtml(msg.message)}</span>
                            <span class="u-wa-time">${escapeHtml(msg.timestamp)}</span>
                        </div>
                    `;
                }).join("");
                body.scrollTop = body.scrollHeight;
            } catch (err) {
                body.innerHTML = `<div style="color: #ef4444; text-align: center; font-size: 0.75rem; padding: 20px;">Failed to load chat.</div>`;
            }
        }

        async function sendUserMessage() {
            const input = document.getElementById("u-wa-input");
            const text = input.value.trim();
            if (!text) return;

            let senderName = localStorage.getItem("dls_user_name");
            if (!senderName) {
                senderName = prompt("Enter your Team/Manager Name:") || "Coach / Player";
                localStorage.setItem("dls_user_name", senderName);
            }

            input.value = "";

            try {
                const getRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { "X-Master-Key": MASTER_KEY }
                });
                const getData = await getRes.json();
                let currentMessages = getData.record.messages || [];

                currentMessages.unshift({
                    sender: senderName,
                    message: text,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });

                const putRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": MASTER_KEY
                    },
                    body: JSON.stringify({ messages: currentMessages })
                });

                if (putRes.ok) {
                    fetchUserMessages();
                }
            } catch (err) {
                alert("Failed to send message.");
            }
        }

        function handleUserWaKeyPress(e) {

        function getTeamDetailedForm(teamName) {
            if (!tournamentData) return [];
            const matches = tournamentData.matches || [];
            const teamMatches = matches.filter(m => 
                m.status === "played" && 
                m.homeScore !== null && 
                m.awayScore !== null && 
                (m.home === teamName || m.away === teamName)
            );

            if (!teamMatches.length) return [];

            const recentMatches = teamMatches.slice(-5);
            return recentMatches.map(m => {
                const isHome = m.home === teamName;
                const myScore = isHome ? Number(m.homeScore) : Number(m.awayScore);
                const oppScore = isHome ? Number(m.awayScore) : Number(m.homeScore);
                const oppName = isHome ? m.away : m.home;

                let outcome = "D";
                if (myScore > oppScore) outcome = "W";
                else if (myScore < oppScore) outcome = "L";

                return {
                    opponent: oppName,
                    scoreline: `${myScore} - ${oppScore}`,
                    result: outcome,
                    round: m.round || "Match"
                };
            });
        }

        function calculateGroupTable(group) {
            const stats = {};
            (group.teams || []).forEach(t => stats[t] = { team: t, mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 });

            if (tournamentData && tournamentData.matches) {
                tournamentData.matches
                    .filter(m => m.group === group.name && m.status === "played" && m.homeScore !== null && m.awayScore !== null)
                    .forEach(m => {
                        const hs = Number(m.homeScore), as = Number(m.awayScore);
                        if (!stats[m.home]) stats[m.home] = { team: m.home, mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
                        if (!stats[m.away]) stats[m.away] = { team: m.away, mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };

                        stats[m.home].mp++; stats[m.away].mp++;
                        stats[m.home].gf += hs; stats[m.home].ga += as;
                        stats[m.away].gf += as; stats[m.away].ga += hs;

                        if (hs > as) { stats[m.home].w++; stats[m.home].pts += 3; stats[m.away].l++; }
                        else if (hs < as) { stats[m.away].w++; stats[m.away].pts += 3; stats[m.home].l++; }
                        else { stats[m.home].d++; stats[m.away].d++; stats[m.home].pts += 1; stats[m.away].pts += 1; }
                    });
            }

            return Object.values(stats).map(t => ({ ...t, gd: t.gf - t.ga }))
                .sort((a, b) => b.pts !== a.pts ? b.pts - a.pts : b.gd !== a.gd ? b.gd - a.gd : b.gf - a.gf);
        }

        function getTeamRecord(teamName) {
            let rec = { mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 };
            if (!tournamentData || !tournamentData.groups) return rec;
            tournamentData.groups.forEach(g => {
                const table = calculateGroupTable(g);
                const found = table.find(t => t.team === teamName);
                if (found) rec = found;
            });
            return rec;
        }

        function renderFormBadgesHtml(formList) {
            if (!formList.length) return `<span style="font-size:0.7rem; color:var(--text-muted);">No games</span>`;
            return formList.map(f => `<span class="predictor-mini-badge ${f.result.toLowerCase()}">${f.result}</span>`).join('');
        }

        function calculateWinPredictor(homeTeam, awayTeam) {
            const homeRec = getTeamRecord(homeTeam);
            const awayRec = getTeamRecord(awayTeam);
            
            const homeFormList = getTeamDetailedForm(homeTeam);
            const awayFormList = getTeamDetailedForm(awayTeam);

            let homeScoreVal = 10 + (homeRec.pts * 3) + (homeRec.gd * 2) + homeRec.gf;
            let awayScoreVal = 10 + (awayRec.pts * 3) + (awayRec.gd * 2) + awayRec.gf;

            const total = homeScoreVal + awayScoreVal + 15; 
            let homePct = Math.round((homeScoreVal / total) * 100);
            let awayPct = Math.round((awayScoreVal / total) * 100);
            let drawPct = 100 - (homePct + awayPct);
            if (drawPct < 10) drawPct = 10;
            if (homePct + awayPct + drawPct !== 100) homePct = 100 - (awayPct + drawPct);

            return { 
                homePct, drawPct, awayPct,
                homeFormHtml: renderFormBadgesHtml(homeFormList),
                awayFormHtml: renderFormBadgesHtml(awayFormList)
            };
        }

                const sf2HomeMgr = getTeamManager(sf2Data.home);
                const sf2AwayMgr = getTeamManager(sf2Data.away);
                const finalHomeMgr = getTeamManager(finalHome);
                const finalAwayMgr = getTeamManager(finalAway);

                let finalInsightsHtml = '';
                if (!finalData || finalData.status !== 'played') {
                    const analysis = calculateWinPredictor(finalHome, finalAway);
                    finalInsightsHtml = `
                        <div class="stats-insights-box">
                            <div class="predictor-title"><span>Championship Win Predictor</span></div>
                            <div class="insights-grid">
                                <div class="predictor-team-stat-card">
                                    <span class="predictor-team-label">${escapeHtml(finalHome)} Form</span>
                                    <div class="predictor-form-capsules">${analysis.homeFormHtml}</div>
                                </div>
                                <div class="predictor-team-stat-card">
                                    <span class="predictor-team-label">${escapeHtml(finalAway)} Form</span>
                                    <div class="predictor-form-capsules">${analysis.awayFormHtml}</div>
                                </div>
                            </div>
                            <div class="predictor-bar-container">
                                <div class="bar-home" style="width: ${analysis.homePct}%">${analysis.homePct >= 12 ? analysis.homePct + '%' : ''}</div>
                                <div class="bar-draw" style="width: ${analysis.drawPct}%">${analysis.drawPct >= 12 ? analysis.drawPct + '%' : ''}</div>
                                <div class="bar-away" style="width: ${analysis.awayPct}%">${analysis.awayPct >= 12 ? analysis.awayPct + '%' : ''}</div>
                            </div>
                            <div class="predictor-legend-row">
                                <span style="color:var(--win);">${escapeHtml(finalHome)}: ${analysis.homePct}%</span>
                                <span style="color:var(--draw);">Draw: ${analysis.drawPct}%</span>
                                <span style="color:#3b82f6;">${escapeHtml(finalAway)}: ${analysis.awayPct}%</span>
                            </div>
                        </div>
                    `;
                }

                const detailedFormHtml = `
                    <div class="detailed-form-box">
                        <div class="form-box-title">📊 Last 5 Match Scorelines & Form</div>
                        <div class="form-teams-grid">
                            <div class="team-form-column">
                                <div class="team-form-name">${escapeHtml(finalHome)}</div>
                                ${renderDetailedFormHtml(finalHome)}
                            </div>
                            <div class="team-form-column">
                                <div class="team-form-name">${escapeHtml(finalAway)}</div>
                                ${renderDetailedFormHtml(finalAway)}
                            </div>
                        </div>
                    </div>
                `;

                const bContainer = document.getElementById("bracket-container");
                if (bContainer) {
                    bContainer.innerHTML = `
                        <div class="knockout-hub" style="align-items: center;">
                            <div class="knockout-stage-section" style="width: 100%;">
                                <div class="knockout-stage-title" style="color:var(--accent); font-weight:800; font-size:0.85rem; margin-bottom:8px;"><span>🔥 Semi-Finals</span></div>
                                <div class="knockout-match-grid">
                                    <div class="match-card" style="margin-bottom:8px;">
                                        <div class="match-meta">
                                            <span>Semi-Final 1</span>
                                            <span class="match-venue">📍 ${escapeHtml(sf1Data.venue || 'Stadium A')}</span>
                                        </div>
                                        <div class="match-body">
                                            <div class="team-side-container">
                                                <div class="team-home">${escapeHtml(sf1Data.home)}</div>
                                                <div class="manager-name manager-home">Coach: ${escapeHtml(sf1HomeMgr)}</div>
                                            </div>
                                            <div class="score-box ${sf1Data.status === 'played' ? 'played' : 'upcoming'}">${sf1Data.status === 'played' ? `${sf1Data.homeScore} - ${sf1Data.awayScore}` : 'VS'}</div>
                                            <div class="team-side-container">
                                                <div class="team-away">${escapeHtml(sf1Data.away)}</div>
                                                <div class="manager-name manager-away">Coach: ${escapeHtml(sf1AwayMgr)}</div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="match-card" style="margin-bottom:0;">
                                        <div class="match-meta">
                                            <span>Semi-Final 2</span>
                                            <span class="match-venue">📍 ${escapeHtml(sf2Data.venue || 'Stadium B')}</span>
                                        </div>
                                        <div class="match-body">
                                            <div class="team-side-container">
                                                <div class="team-home">${escapeHtml(sf2Data.home)}</div>
                                                <div class="manager-name manager-home">Coach: ${escapeHtml(sf2HomeMgr)}</div>
                                            </div>
                                            <div class="score-box ${sf2Data.status === 'played' ? 'played' : 'upcoming'}">${sf2Data.status === 'played' ? `${sf2Data.homeScore} - ${sf2Data.awayScore}` : 'VS'}</div>
                                            <div class="team-side-container">
                                                <div class="team-away">${escapeHtml(sf2Data.away)}</div>
                                                <div class="manager-name manager-away">Coach: ${escapeHtml(sf2AwayMgr)}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="knockout-stage-section grand-final-card" style="border-radius:14px; padding:16px; width: 100%; margin-top:12px;">
                                <div class="grand-final-title"><span>🏆 Championship Grand Final</span></div>
                                <div class="match-card" style="margin-bottom:0; background:transparent; border:none; box-shadow:none;">
                                    <div class="match-meta">
                                        <span>Grand Final</span>
                                        <span class="match-venue">📍 ${escapeHtml(finalData.venue || 'Championship Arena')}</span>
                                    </div>
                                    <div class="match-body">
                                        <div class="team-side-container">
                                            <div class="team-home">${escapeHtml(finalHome)}</div>
                                            <div class="manager-name manager-home">Coach: ${escapeHtml(finalHomeMgr)}</div>
                                        </div>
                                        <div class="score-box ${finalData.status === 'played' ? 'played' : 'upcoming'}">${finalData.status === 'played' ? `${finalData.homeScore} - ${finalData.awayScore}` : 'VS'}</div>
                                        <div class="team-side-container">
                                            <div class="team-away">${escapeHtml(finalAway)}</div>
                                            <div class="manager-name manager-away">Coach: ${escapeHtml(finalAwayMgr)}</div>
                                        </div>
                                    </div>
                                    ${finalInsightsHtml}
                                </div>
                            </div>
                            ${commentaryHtml}
                            ${detailedFormHtml}
                        </div>
                    `;
                }
            }
        }

        function switchTab(id, btn) {
            document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            const targetSec = document.getElementById(id);
            if (targetSec) targetSec.classList.add("active");
            if (btn) btn.classList.add("active");
        }

        function escapeHtml(str) {
            return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
